name = "cartaxi-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# หน้าแอป (public/index.html) เปิดได้ที่ https://<worker>/  ส่วน /api และ /photos ให้ Worker จัดการ
[assets]
directory = "./public"
binding = "ASSETS"

# ผูก R2 bucket "cartaxi" ให้ Worker ใช้งานผ่านตัวแปร env.BUCKET
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cartaxi"

# Workers AI ใช้อ่านเลขไมล์/น้ำมันจากรูปที่คนขับส่งในกลุ่ม LINE
[ai]
binding = "AI"

# จำกัดเว็บที่เรียก API ได้ (ใส่โดเมนที่วางไฟล์ HTML เช่น "https://fleet.2psservices.com")
# ปล่อย "*" ไว้ได้ถ้าเปิดไฟล์ HTML จากหลายที่
[vars]
ALLOW_ORIGIN = "*"

# รหัสลับ ตั้งด้วยคำสั่ง (ห้ามเขียนลงไฟล์นี้):
#   npx wrangler secret put APP_KEY     ← รหัสคนขับ
#   npx wrangler secret put ADMIN_KEY   ← รหัสแอดมิน
